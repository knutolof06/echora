[package]
name = "yanki"
version.workspace = true
edition.workspace = true
build = "build.rs"

[[bin]]
name = "echora"
path = "src/main.rs"

[dependencies]
kulak = { path = "../../crates/kulak" }
anlayici = { path = "../../crates/anlayici" }
komut = { path = "../../crates/komut" }
eylemci = { path = "../../crates/eylemci" }
sahne = { path = "../../crates/sahne" }
studyo = { path = "../../crates/studyo" }
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Networking_WinHttp",
    "Win32_Security",
    "Win32_System_Console",
    "Win32_Storage_FileSystem",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_System_SystemInformation",
    "Win32_Graphics_Gdi",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
# Yalnız okuma (açma); deflate saf Rust (zlib-rs). Sıkıştırma/şifreleme özellikleri kapalı.
zip = { version = "9.5.1", default-features = false, features = ["deflate-flate2-zlib-rs"] }
sha2 = "0.11.1"
serde_json = "1.0.154"
serde = { version = "1.0.229", features = ["derive"] }
